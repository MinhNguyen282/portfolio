<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <meta
      name="description"
      content="Back-end developer and CS student at VNU-HCM. I build scalable APIs with Spring Boot and Node.js, and deploy with modern CI/CD pipelines. Explore my projects, experience, and publications."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Fonts: preconnect + direct <link> so the preload scanner starts these
         during HTML parse. Space Grotesk and the italic face were dropped as
         they are not referenced anywhere in the app. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- The hero avatar is the LCP element on "/". Preloading it lets the
         request start during HTML parse instead of waiting for React to mount.
         type="image/webp" means browsers without WebP simply skip this. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="%PUBLIC_URL%/avatar-768.webp"
      imagesrcset="%PUBLIC_URL%/avatar-384.webp 384w, %PUBLIC_URL%/avatar-768.webp 768w"
      imagesizes="(min-width: 1024px) 384px, (min-width: 768px) 320px, 288px"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Nguyễn Hữu Hoàng Minh - Software Engineer Portfolio</title>
    <meta property="og:title" content="Nguyễn Hữu Hoàng Minh - Software Engineer Portfolio" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nhhminh.dev/" />
    <meta property="og:image" content="https://www.nhhminh.dev/avatar.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.nhhminh.dev/" />
    <!-- Person schema — static fallback for non-JS crawlers and AI citation engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://www.nhhminh.dev/#person",
      "name": "Nguyễn Hữu Hoàng Minh",
      "jobTitle": "Software Engineer",
      "description": "Back-end developer and CS student at VNU-HCM, specializing in Spring Boot, Node.js, and scalable web applications.",
      "url": "https://www.nhhminh.dev",
      "image": "https://www.nhhminh.dev/avatar.jpg",
      "email": "nhhminh.2004.work@gmail.com",
      "sameAs": [
        "https://github.com/MinhNguyen282",
        "https://www.linkedin.com/in/minhnguyenapcs22"
      ],
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Ho Chi Minh City University of Science (VNU-HCM)"
      },
      "knowsAbout": ["Spring Boot", "Node.js", "ReactJS", "Java", "JavaScript", "MySQL", "MongoDB", "Backend Development", "CI/CD"]
    }
    </script>
    <!-- WebSite schema for SiteLinksSearchBox eligibility -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nguyễn Hữu Hoàng Minh — Portfolio",
      "url": "https://www.nhhminh.dev"
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
